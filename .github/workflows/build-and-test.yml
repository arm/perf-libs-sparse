name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS / LLVM / OpenMP ${{ matrix.openmp }} / Int64 ${{ matrix.int64 }}
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        openmp: [on, off]
        int64:  [on, off]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install toolchain
        run: |
          brew install llvm flang libomp arm-performance-libraries
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python -m pip install mako

      - name: Show toolchain
        run: |
          clang++ --version
          flang --version

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          FC: flang
        run: |
          source "$(find /opt/arm -maxdepth 2 -name armpl_env_vars.sh -print -quit)"
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPARSE_ENABLE_OPENMP=${{ matrix.openmp }} \
            -DSPARSE_ENABLE_INT64=${{ matrix.int64 }}

      - name: Build
        run: cmake --build build-ci --parallel 4

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

